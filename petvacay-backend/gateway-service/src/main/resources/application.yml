spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      routes:
        # Ruta separada y PRIMERA para /auth/**: es la unica que lleva rate
        # limiting agresivo. Son endpoints anonimos, asi que un atacante puede
        # encadenar intentos de login sin identificarse; BCrypt encarece cada
        # intento pero no impide hacer miles.
        - id: identity-auth
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                # 5 por segundo con picos de 10: sobrado para una persona
                # escribiendo su contrasena, inutil para fuerza bruta.
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # /internal/** de identity-service NO se enruta aqui a proposito: es un
        # contrato exclusivo para llamadas servicio-a-servicio (booking-service lo
        # consume directamente por su URL interna) y nunca debe quedar accesible
        # desde el navegador a traves del Gateway.
        - id: identity-service
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/users/**,/api/v1/pets/**,/api/v1/sitters/**,/api/v1/admin/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

        # Prefijo propio: las resenas publicas de un cuidador no son una
        # operacion "de una reserva concreta" (eso ya lo cubre la ruta de
        # arriba), son la vitrina de reputacion de cara al buscador. Las sirve
        # booking-service, que es quien tiene el agregado Review.
        - id: reviews
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

        # Ruta separada y ANTES que la general de search-service (Gateway evalua
        # rutas en orden, la primera que casa gana): /geocode reenvia a Nominatim,
        # cuya politica de uso exige un maximo de 1 peticion/segundo EN TOTAL. El
        # limite de aqui es por IP, no global, asi que no lo garantiza del todo
        # con muchos usuarios concurrentes — ver el javadoc de
        # NominatimGeocodingAdapter para el plan si esto pasa a produccion real.
        - id: search-geocode
          uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/search/geocode
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 2

        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/search/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                # El buscador es publico y se consulta al teclear filtros: el
                # limite es mas holgado que en el resto.
                redis-rate-limiter.replenishRate: 50
                redis-rate-limiter.burstCapacity: 100

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: '#{@clientIpKeyResolver}'
                redis-rate-limiter.replenishRate: 30
                redis-rate-limiter.burstCapacity: 60

petvacay:
  cors:
    # Origenes del frontend. En produccion hay que poner el dominio real: dejar
    # localhost bloquearia al frontend desplegado.
    allowed-origins: ${PETVACAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    org.springframework.cloud.gateway: INFO
