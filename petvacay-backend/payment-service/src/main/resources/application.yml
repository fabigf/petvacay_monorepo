spring:
  application:
    name: payment-service
  profiles:
    default: dev
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8085
  error:
    include-message: never

petvacay:
  messaging:
    # payment-service solo consume eventos de reserva, nunca publica los suyos.
    provider: spring
  payments:
    # simulated (por defecto): sin cuenta de Stripe, para desarrollo local.
    # stripe: integracion real; exige secret-key y webhook-secret.
    provider: ${PETVACAY_PAYMENTS_PROVIDER:simulated}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      # Sin este secreto el webhook rechaza TODO: aceptar eventos sin verificar
      # la firma seria peor que no tener webhook.
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

logging:
  level:
    com.petvacay: INFO

---
# Perfil de desarrollo: H2 en memoria, sin dependencias externas.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:payment;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

logging:
  level:
    com.petvacay: DEBUG

---
# Perfil de docker/produccion local: PostgreSQL gestionado con Flyway + Kafka.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/payment}
    username: ${POSTGRES_USER:petvacay}
    password: ${POSTGRES_PASSWORD:petvacay}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

petvacay:
  messaging:
    provider: kafka

logging:
  level:
    # El cliente de Kafka registra cada rebalanceo de grupo a nivel INFO: en
    # cada arranque o reinicio de una replica, eso inunda el log. WARN deja
    # pasar los fallos de conexion reales sin el ruido del protocolo normal.
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
