server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los assets con hash en el nombre son inmutables.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desde la Fase 4 el unico backend que existe detras de este proxy es el API
    # Gateway: reparte cada ruta entre los 4 microservicios.
    location /api/ {
        proxy_pass http://gateway-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $proxy_add_x_forwarded_for CONCATENA con lo que ya traiga el cliente en
        # vez de reemplazarlo: un atacante podria anteponer una IP falsa y el
        # Gateway (que lee el primer valor) usaria esa en lugar de la real,
        # saltandose el rate limiting de /auth/login. $remote_addr es la IP de la
        # conexion TCP real, infalsificable por el cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
